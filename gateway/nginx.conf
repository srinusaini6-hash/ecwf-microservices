events {}
http {
    server {
        listen 80;
        client_max_body_size 20m;

        location /api/v1/auth/ { proxy_pass http://authentication-service:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/mfa/ { proxy_pass http://authentication-service:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /auth/google/ { proxy_pass http://authentication-service:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/federation/ { proxy_pass http://authentication-service:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/users/ { proxy_pass http://user-service:8002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/dashboard/individual { proxy_pass http://user-service:8002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/dashboard/organization { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/organizations/ { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/tenants { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/departments { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/invitations { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/memberships { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/rbac/ { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/access/ { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/audit/ { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/audit-logs { proxy_pass http://tenant-admin-service:8003; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/notifications/ { proxy_pass http://notification-service:8004; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    }
}
