services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - ecwf_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    env_file:
      - ./.env
      - ./services/notification-service/.env
    ports:
      - "8004:8004"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8004"
    restart: on-failure

  authentication-service:
    build: ./services/authentication-service
    env_file:
      - ./.env
      - ./services/authentication-service/.env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    restart: on-failure

  user-service:
    build: ./services/user-service
    env_file:
      - ./.env
      - ./services/user-service/.env
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      authentication-service:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8002"
    restart: on-failure

  tenant-admin-service:
    build: ./services/tenant-admin-service
    env_file:
      - ./.env
      - ./services/tenant-admin-service/.env
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy
      authentication-service:
        condition: service_started
      user-service:
        condition: service_started
      notification-service:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8003"
    restart: on-failure

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - authentication-service
      - user-service
      - tenant-admin-service
      - notification-service

volumes:
  ecwf_db_data:
